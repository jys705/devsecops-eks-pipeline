apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2-devsecops-app
  namespace: p2-devsecops
  labels:
    app: p2-devsecops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p2-devsecops-app
  template:
    metadata:
      labels:
        app: p2-devsecops-app
    # 파드 수준 securityContext
    # PSA의 runAsNonRoot는 이미지 설정을 신뢰하지 않고 매니페스트에 선언이 있어야 통과시키고, 
    # Checkov의 CKV_K8S_40은 10000 초과를 매니페스트에서 확인
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # 컨테이너 수준 securityContext
      containers:
        - name: app
          image: 453722413421.dkr.ecr.ap-northeast-2.amazonaws.com/p2-devsecops-app:a11c7eecea7dfff6bc9c95e16d96229a88f316ff@sha256:b19322f69509c49a50872da4b05a5ed75acf7960af2402b41d07338fc5f85935
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}