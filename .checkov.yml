# 이 저장소에서 끈 체크와 근거 기록.
# 여기 없는 체크는 전부 켜져 있고, 실패하면 머지가 막힌다.
# 특정 리소스 하나만 끄는 것은 이 파일이 아니라 해당 .tf의
# #checkov:skip 주석으로 한다(bootstrap/kms.tf 참고).
# 다만 그 주석은 머지 보호를 통과시키지 못하므로, 변경분 안에 들어올 줄이면
# 이 파일에 적어야 한다. 파일 끝의 두 항목이 그 경우다.

skip-check:
  # ── 이 프로젝트가 단계마다 전부 삭제하기 때문에 성립하지 않는 것 ──

  # 로그 그룹 보존 기간 1년 이상.
  # 클러스터와 Flow Logs 로그 그룹은 한 세션 동안만 존재하고
  # retention_in_days를 짧게 잡아 destroy 후 잔여물이 남지 않게 했다.
  - CKV_AWS_338

  # 로그 그룹 CMK 암호화. CMK는 destroy 시 최소 7일 삭제 대기에 걸려
  # 다음 세션의 같은 이름 재생성을 막는다.
  - CKV_AWS_158

  # EKS Secret 봉투 암호화. 위와 같은 CMK 문제.
  - CKV_AWS_58

  # Session Manager 세션 데이터 KMS 암호화. 역시 CMK가 필요하다.
  # 세션 전송 구간은 인터넷 경로 없이 VPC 엔드포인트까지 TLS로 간다.
  - CKV_AWS_112

  # ── 이미 다르게 판단한 것 ──

  # EKS 컨트롤 플레인 로그 다섯 종류 전부.
  # audit 하나만 택했다. 나머지 넷은 이 프로젝트가
  # 확인하려는 질문(누가 클러스터 API를 호출했나)에 답하지 않는다.
  - CKV_AWS_37

  # CloudTrail 로그의 KMS CMK 암호화.
  # CloudTrail 서비스 주체는 AWS 관리형 키로 전달할 수 없고
  # CMK는 위의 삭제 대기 문제에 걸린다. 그래서 SSE-S3로 뒀다.
  - CKV_AWS_35

  # S3 버킷 기본 암호화를 KMS로.
  # 위와 같은 이유로 CloudTrail 버킷만 SSE-S3다.
  # 세션 로그 버킷은 SSM Agent가 계정 내 IAM 주체로 호출하므로
  # 관리형 키를 쓸 수 있고 이 체크를 통과한다.
  - CKV_AWS_145

  # CloudTrail을 CloudWatch Logs에도 전달.
  # 세 기록의 대상을 나눴고 CloudTrail은 S3다.
  # 같은 기록을 두 곳에 두면 저장 비용이 두 배가 되고 전달 역할이 하나 더 는다.
  - CKV2_AWS_10

  # ── 받을 대상이나 갈 곳이 없는 것 ──

  # CloudTrail 로그 파일 전달 시 SNS 알림.
  # 알림을 받을 대상이 이 구성에 없다.
  - CKV_AWS_252

  # S3 이벤트 알림. 위와 같다.
  - CKV2_AWS_62

  # S3 교차 리전 복제. 리전이 ap-northeast-2로 고정돼 있고
  # Identity Center 인스턴스가 리전을 바꿀 수 없다. 복제할 대상 리전이 없다.
  - CKV_AWS_144

  # S3 접근 로깅. 기록을 받을 버킷을 하나 더 만들면 그 버킷도
  # 같은 체크에 걸린다. tfstate 접근은 KMS 복호화 호출로 CloudTrail에 남는다.
  - CKV_AWS_18

  # S3 수명 주기 규칙. 보존 기간은 로그 그룹의 retention_in_days로 잡았고
  # 버킷은 단계 종료 시 통째로 삭제한다.
  - CKV2_AWS_61

  # 서비스 어카운트 토큰 마운트 해제.
  # automountServiceAccountToken: false는 컨테이너에서 클러스터 API로 가는 경로를 막는다.
  - CKV_K8S_38

  # 파드에 대응하는 NetworkPolicy.
  # VPC CNI의 네트워크 정책 기능을 켜거나 별도 컨트롤러를 배치해야 하고
  # 파드 사이 통신 설계는 이 저장소의 주제와 다르다.
    # IGW도 NAT도 없어 인터넷 방향 경로가 없고 S3 엔드포인트 정책이 버킷을 제한한다.
    # 남는 방향에서 파드가 할 수 있는 것도 적다. 자격 증명이 없어 엔드포인트로 할 것이 없고
    # 서비스가 하나라 서비스 간 화이트리스트를 정의할 대상이 없다.
  - CKV2_K8S_6

  # 인라인 #checkov:skip은 로컬 스캔과 잡을 통과시키고 SARIF에 suppressions까지 실리지만,
  # 머지 보호는 분석에 실린 결과 개수를 세어 차단한다. 억제된 결과도 결과로 남는다.
  # 닫을 알림이 만들어지지 않아 Dismiss로 풀 수도 없다. 근거는 docs/branch-protection.md에 있다.

  # 전용 CMK를 만들면 destroy 뒤 최소 7일 삭제 대기로 계정에 남고 그 동안 과금된다.
  # 단계마다 계정을 0으로 되돌리는 것이 전제라 관리형 aws/secretsmanager 키를 쓴다
  - CKV_AWS_149
  # 회전 Lambda를 두지 않는다. 소비자가 없는 증명용 시크릿이고 회전 주기를 판단할 근거가 없다
  - CKV2_AWS_57