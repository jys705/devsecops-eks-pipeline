# scan은 fork PR에서도 돌아야 하므로 잡 조건이 없다.
# push는 main에 머지된 것만 올린다.
name: image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: image (scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      image_id: ${{ steps.built.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t p2-devsecops-app:${{ github.sha }} app

      - name: Record image id
        id: built
        run: |
          ID=$(docker image inspect -f '{{.Id}}' p2-devsecops-app:${{ github.sha }})
          echo "scanned image id: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          
      - name: Smoke test
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp \
            -p 8080:8080 p2-devsecops-app:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/healthz; then OK=1; break; fi
            sleep 1
          done
          echo
          docker logs smoke
          docker rm -f smoke
          [ "${OK:-0}" = "1" ]

      - name: Trivy report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: p2-devsecops-app:${{ github.sha }}
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          exit-code: '0'
      
      # 순서가 설정. 
      # 업로드를 게이트 앞에 두면 if: always()가 필요 없다. 
      # Checkov는 검사와 업로드가 한 스텝이라 always()를 걸어야 했지만, 여기서는 순서로 같은 결과를 얻는다. 
      # 그리고 게이트가 실패하면 뒤의 Save image와 아티팩트 업로드가 안 돌아 취약한 이미지가 push 잡으로 넘어갈 경로 자체가 없다.
      - name: Upload SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Trivy gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: p2-devsecops-app:${{ github.sha }}
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: Summary
        if: always()
        run: |
          cat trivy-table.txt || true
          {
            echo "### Trivy (CRITICAL, HIGH)"
            echo ""
            echo '```'
            cat trivy-table.txt 2>/dev/null || echo "결과 파일 없음"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save image
        run: docker save p2-devsecops-app:${{ github.sha }} -o image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ github.sha }}
          path: image.tar
          retention-days: 1

  push:
    name: image (push)
    needs: scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ github.sha }}

      - name: Load image and compare id
        id: loaded
        run: |
          docker load -i image.tar
          LOADED=$(docker image inspect -f '{{.Id}}' p2-devsecops-app:${{ github.sha }})
          echo "scanned by trivy : ${{ needs.scan.outputs.image_id }}"
          echo "loaded for push  : $LOADED"
          echo "id=$LOADED" >> "$GITHUB_OUTPUT"
          [ "$LOADED" = "${{ needs.scan.outputs.image_id }}" ]

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/p2-devsecops-gha-push
          aws-region: ap-northeast-2

      - name: Who am I
        run: aws sts get-caller-identity

      - name: tfstate must be denied
        run: |
          if aws s3api get-object \
               --bucket tfstate-${{ vars.AWS_ACCOUNT_ID }}-apne2 \
               --key infra/terraform.tfstate /dev/null 2> err.txt; then
            echo "FAIL: push role read the state file"
            exit 1
          fi
          cat err.txt
          grep -q "AccessDenied" err.txt

      - name: Push to ECR
        run: |
          REG=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
          aws ecr get-login-password --region ap-northeast-2 \
            | docker login --username AWS --password-stdin "$REG"
          docker tag p2-devsecops-app:${{ github.sha }} "$REG/p2-devsecops-app:${{ github.sha }}"
          docker push "$REG/p2-devsecops-app:${{ github.sha }}"

      - name: Digest in ECR
        id: digest
        run: |
          aws ecr describe-images \
            --repository-name p2-devsecops-app \
            --image-ids imageTag=${{ github.sha }} \
            --query 'imageDetails[0].{digest:imageDigest,pushedAt:imagePushedAt,bytes:imageSizeInBytes}' \
            | tee ecr.json
          echo "value=$(jq -r .digest ecr.json)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com/p2-devsecops-app
          subject-digest: ${{ steps.digest.outputs.value }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### 스캔한 이미지와 올린 이미지가 같은가"
            echo ""
            echo "| 시점 | 이미지 ID |"
            echo "|---|---|"
            echo "| Trivy가 검사할 때 | \`${{ needs.scan.outputs.image_id }}\` |"
            echo "| tar를 불러온 뒤 | \`${{ steps.loaded.outputs.id }}\` |"
            echo ""
            echo "**이 두 줄이 같아야 한다.** 다르면 앞 스텝이 잡을 실패시킨다."
            echo ""
            echo "### ECR에 올린 것"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 커밋 | \`${{ github.sha }}\` |"
            echo "| 매니페스트 다이제스트 | \`${{ steps.digest.outputs.value }}\` |"
            echo ""
            echo "**위 Attestation Created 링크의 Subject digest가 이 다이제스트와 같으면 성공이다.**"
            echo "배포할 때 \`scripts/deploy.sh\`가 매니페스트에 채우는 값도 이것이다."
            echo ""
            echo "세 값이 서로 다른 것이 정상이다. 이미지 ID는 이미지 설정의 해시, 매니페스트 다이제스트는"
            echo "설정과 레이어 목록을 담은 매니페스트의 해시, 아래 Artifacts의 Digest는 tar를 담은"
            echo "압축 파일의 해시다. 대상이 셋 다 다르다."
          } >> "$GITHUB_STEP_SUMMARY"