name: terraform plan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # write가 없으면 러너가 OIDC 토큰을 발급받지 못한다.
  # 이름이 write지만 AWS 권한이 아니라 토큰 요청 허용이다.
  id-token: write

# sub 출력 스텝을 configure-aws-credentials 앞에 둔 이유는 수임이 실패해도 sub가 로그에 남아야 원인을 볼 수 있기 때문이다. 
# ::add-mask::로 토큰 원문을 가린다. (실습용 공개 저장소임을 감안)
jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show OIDC subject claim
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d | jq '{sub, aud, event_name, ref}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/p2-devsecops-gha-plan
          aws-region: ap-northeast-2

      - name: Who am I
        run: aws sts get-caller-identity

      - name: ECR read is allowed
        run: aws ecr describe-repositories --repository-names p2-devsecops-app

      - name: ECR write must be denied
        run: |
          if aws ecr initiate-layer-upload --repository-name p2-devsecops-app 2> err.txt; then
            echo "FAIL: plan role started a layer upload"
            exit 1
          fi
          cat err.txt
          grep -q "AccessDeniedException" err.txt

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config="bucket=tfstate-${{ vars.AWS_ACCOUNT_ID }}-apne2"

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -lock=false -input=false